services:
  postgres:
    image: postgres:17-alpine
    container_name: portal-postgres
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
    ports:
      - "5433:5432"   # publicado para o "npm run dev" na máquina
    volumes:
      - portal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  portal:
    build: .
    image: portal-do-conhecimento
    container_name: portal-do-conhecimento
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      SEED_PASSWORD: ${SEED_PASSWORD:-Portal2026}
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:-portal}@postgres:5432/portal
    ports:
      - "3200:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  portal-pgdata:
